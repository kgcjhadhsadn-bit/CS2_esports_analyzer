# Betclic.pl market-name rules for cs2bot (loaded by cs2bot.odds.market_mapping.MarketMapper).
#
# Betclic's exact Polish CS2 market names could not be verified from outside Poland, so these rules
# are deliberately broad (Polish AND English wording). Tune them on the owner's PC:
#   * `cs2bot odds unmapped` lists raw market names that never mapped (cs2bot.odds.list_unmapped),
#   * raw payloads are saved under data/raw/betclic/<UTC date>/ for offline inspection.
#
# HOW MATCHING WORKS
# ------------------
# * Market names are "folded" before matching: lowercase, no Polish diacritics (ł -> l, ż -> z ...),
#   typographic dashes/minus -> "-", whitespace collapsed. "Zwycięzca mapy 1" -> "zwyciezca mapy 1".
#   Write patterns in plain lowercase ASCII.
# * Rules are tried IN ORDER; the first rule whose `patterns` match (re.search) and whose
#   `exclude` patterns do NOT match is used. If the selection cannot be parsed the next rule is
#   tried. Put specific rules before generic ones.
# * Named groups in patterns: map, map_from + map_to, round, pistol (1st/2nd pistol -> round 1/13),
#   half, n (race-to N -> line), line, team, player, player2.
# * extract: generic extractors run on the market name when the pattern did not capture the value:
#     map     "mapa 1", "1. mapa", "mapie 2", "map 3", "1st map", "pierwsza mapa"
#     maps    map ranges/lists "mapy 1-2", "mapy 1 i 2", "maps 1-3" (maps_scope)
#     half    "1. polowa", "druga polowa", "1st half"
#     player  the single name segment left after removing `segment_stopwords` and map references
#     players two names ("s1mple vs zywoo", "s1mple czy zywoo") for head-to-head markets
# * exclude / segment_stopwords: regex lists; nested lists (from the YAML anchors below) are flattened.
#   "Najlepszy gracz" (MVP / rating) is deliberately NOT a kills market.
# * requires: params that must be known, else the selection stays unmapped (never bet):
#     map, line, team, player, players, half, round, and
#     scope   an explicit scope: a map ("mapa 1"), several maps ("mapy 1-2") or the whole match
#             ("... - mecz", "... w meczu"). Kill lines REQUIRE it: a 19,5 line priced over a whole
#             series instead of one map would look like a certain winner to the model.
# * team_in_market: required | optional - look for one of the event's team names in the market name.
# * selection kinds (how the selection text is read, always converted to OUR team1/team2 orientation):
#     team             team name (fuzzy vs the event's teams), or "1" / "2"
#     team_draw        team, or a draw word (X / Remis)
#     team_line        team + handicap, "Natus Vincere (-1,5)", "1 -1,5"; a line in the MARKET name
#                      ("Handicap map (-1,5)") is the bookmaker's FIRST team's handicap
#     over_under       "Powyżej 2,5" / "Poniżej 2,5" / "Over 2.5" (line from the market if absent)
#     yes_no           "Tak" / "Nie" / "Yes" / "No"
#     odd_even         "Nieparzysta" / "Parzysta" / "Odd" / "Even"
#     map_score        "2:1", "2-1", "Natus Vincere 2:1" (named team's score first) - series score
#     round_score      "13:9" - map score (winner must reach 13+)
#     player           a player nickname (resolved to an internal player id via the lineups)
#     player_draw      player, or a draw word
#     player_over_under  "s1mple Powyżej 19,5" (player from the selection or from the market name)
#
# SAFETY GUARDS (section `guards:` below; defaults live in cs2bot.odds.market_mapping)
# -----------------------------------------------------------------------------------
# A wrongly mapped market is far worse than an unmapped one (the bot bets when the model is
# confident, and a mis-read market often looks like a sure thing), so on top of the rules:
#   * names stating "bez dogrywki" / "regulaminowy czas" / "regular time" (overtime EXCLUDED) or
#     "z dogrywką" / "incl. overtime" (INCLUDED) are checked against the settlement rules the pricing
#     engine uses (CS2BOT_BETCLIC__TOTALS_INCLUDE_OVERTIME): round totals / handicaps / odd-even are
#     mapped only when the wording agrees with the setting; every other market type is always priced on
#     the final result, so its "regulation only" variant stays unmapped. The qualifier is removed from
#     the name before the rules below run.
#   * draw-no-bet, double chance and combined markets ("Zwycięzca meczu i liczba map") are never mapped.
#   * a two-way market type listing a draw selection ("Remis", "X") is a three-way (regulation time /
#     European handicap) market and stays unmapped; a head-to-head kills market listing a draw is mapped
#     only when CS2BOT_BETCLIC__H2H_TIE_RULE=lose.
#   * over/under, yes/no and odd/even selections carrying anything else ("Powyżej 2,5 i NAVI") stay unmapped.
#   * lines outside `guards.line_bounds` (e.g. a map handicap of 4,5) stay unmapped.
#
# HANDICAP CONVENTION (cs2bot.domain.markets): spec.line is TEAM1's handicap in OUR orientation.
#   "Team2 -1.5" -> line +1.5 with selection team2;  "Team1 -1.5" -> line -1.5 with selection team1.
#   If the Betclic event lists our team2 first (teams_swapped) the bookmaker slots are flipped first.

version: 1

settings:
  team_match_threshold: 72      # 0-100 similarity needed to read a selection as a team name
  team_match_margin: 6          # ... and by how much it must beat the other team
  player_match_threshold: 90    # fuzzy nickname match threshold (exact matches always win)
  words:                        # folded forms; quote everything (YAML 1.1 reads bare no/yes as booleans)
    over: ["powyzej", "over", "wiecej niz", "ponad"]
    under: ["ponizej", "under", "mniej niz"]
    "yes": ["tak", "yes"]
    "no": ["nie", "no"]
    odd: ["nieparzysta", "nieparzyste", "nieparzysty", "nieparzystych", "nieparzysta liczba", "odd"]
    even: ["parzysta", "parzyste", "parzysty", "parzystych", "parzysta liczba", "even"]
    draw: ["x", "remis", "draw", "tie", "rowno", "zaden", "zadna", "nikt", "neither"]

# Safety guards. Every key is optional (the defaults in cs2bot.odds.market_mapping apply); a list
# given here REPLACES the default list. Patterns are matched against the folded market name.
guards:
  excludes_overtime:
    - '\(?\s*bez (?:dogrywki|dogrywek|dogrywka|ot)\b\s*\)?'
    - '\(?\s*(?:tylko )?(?:w )?(?:regulaminow|podstawow)\w* czas\w*(?: gry)?\s*\)?'
    - '\(?\s*(?:regular|regulation|normal) time\s*\)?'
    - '\(?\s*\bregulation\b\s*\)?'
    - '\(?\s*(?:excl(?:\.|uding)?|without|no|w/o) (?:overtime|ot)\b\s*\)?'
  includes_overtime:
    - '\(?\s*(?<![a-z])(?:z|wraz z|lacznie z|wliczajac|w tym|uwzgledniajac) (?:dogrywk\w+|ot)\b\s*\)?'
    - '\(?\s*(?:incl(?:\.|uding)?|with) (?:overtime|ot)\b\s*\)?'
  unsupported:
    - 'bez remisu'
    - '\bdraw no bet\b'
    - '\bdnb\b'
    - 'podwojna szansa'
    - '\bdouble chance\b'
    - 'zaklad laczony'
    - '\bkombi\w*'
    - '\bcombo\b'
    - '(?<!\d)\s(?:i|oraz|and)\s(?!\d)'          # "Zwycięzca meczu i liczba map" (not "mapy 1 i 2")
    - '(?<![\d\s])\s*[+&]\s*(?![\d(\s])'          # "Zwycięzca meczu + Handicap" (not "(+1,5)", "mapa 1 + 2")
  line_bounds:                  # inclusive [low, high]; handicaps: absolute value
    map_handicap: [0, 2.5]
    total_maps: [1.5, 4.5]
    round_handicap: [0, 12.5]
    total_rounds: [13, 40]
    team_total_rounds: [0.5, 16.5]
    race_to_rounds: [1, 16]
    player_kills: [0.5, 150]

# Reusable exclusion lists (YAML anchors).
excludes:
  half: &half ['polow', '\bhalf\b', '\bhalves\b']
  pistol: &pistol ['pistolet', '\bpistol\b']
  players: &players ['zabojstw', '\bkills?\b', '\bfrag', '\bgracz', '\bplayer', 'headshot', 'asyst', 'zgon', 'smierc']
  odd_even: &odd_even ['parzyst', '\bodd\b', '\beven\b']

rules:
  # ---------------------------------------------------------------- round-level / map props
  - id: total_rounds_odd_even
    market_type: total_rounds_odd_even
    patterns:
      - '(?:nie)?parzyst'
      - '\bodd\b.*\beven\b'
      - '\beven\b.*\bodd\b'
    exclude: [*half, *pistol, 'zabojstw', '\bkills?\b', 'liczba map', 'suma map']
    extract: [map]
    requires: [map]
    selection: odd_even

  - id: map_overtime
    market_type: map_overtime
    patterns:
      - 'dogrywk'
      - '\bovertime\b'
    exclude: [*half, *players]
    extract: [map]
    requires: [map]
    selection: yes_no

  - id: race_to_rounds
    market_type: race_to_rounds
    patterns:
      - 'pierwsz\w* do (?P<n>\d{1,2}) rund'
      - 'wyscig do (?P<n>\d{1,2}) rund'
      - 'kto pierwszy (?:wygra|zdobedzie|osiagnie) (?P<n>\d{1,2}) rund'
      - '\brace to (?P<n>\d{1,2})\b'
      - '\bfirst to (?P<n>\d{1,2}) rounds?\b'
    exclude: [*half]
    extract: [map]
    requires: [map, line]
    selection: team

  - id: pistol_round_winner
    market_type: pistol_round_winner
    patterns:
      - '(?<![\d.,])(?P<pistol>[12])\s*\.?\s*rund\w* pistolet'
      - '(?P<pistol>pierwsz|drug)\w* rund\w* pistolet'
      - 'rund\w* pistolet\w*(?: nr\.?)? (?P<pistol>[12])\b'
      - 'rund\w* pistolet'
      - '(?<![\d.,])(?P<round>1|13)\s*\.?\s*rund[ayie]\b'
      - '\bzwyciezca (?P<round>1|13)\s*\.?\s*rund'
      - '(?P<pistol>1st|2nd|first|second) pistol round'
      - '\bpistol round (?P<pistol>[12])\b'
      - '\bpistol round\b'
      - '\bround (?P<round>1|13) winner\b'
      - '\b(?P<round>1|13)(?:st|th) round\b'
      - '\bwinner (?:of )?round (?P<round>1|13)\b'
      - '\brund[ay] (?:nr\.? ?)?(?P<round>1|13)(?![\d.,]|\s*-\s*\d)'      # "Mapa 1 - Runda 13 - zwycięzca"
      - '\bround (?P<round>1|13)(?![\d.,]|\s*-\s*\d)'
    # "obie rundy pistoletowe" / "both pistol rounds" (win BOTH) is a different market
    exclude: [*half, 'handicap', 'liczba', 'suma', 'zabojstw', '\bkills?\b', 'pierwsz\w* do \d',
              '\bob(?:u|ie|ydwie|ydwu|a)\b', '\bboth\b', '\bkazd', '\beach\b', '\bany\b', 'ktorakolwiek']
    extract: [map]
    defaults: {round: 1}
    allowed: {round: [1, 13]}
    requires: [map, round]
    selection: team

  - id: half_winner
    market_type: half_winner
    patterns:
      - 'polow'
      - '\bhalf\b'
    exclude: ['handicap', 'liczba', 'suma', 'total', 'dokladny', 'wynik dokladny', 'correct score', *odd_even,
              'powyzej', 'ponizej', '\bover\b', '\bunder\b', *pistol, *players]
    extract: [map, half]
    requires: [map, half]
    selection: team_draw

  - id: map_correct_score
    market_type: map_correct_score
    patterns:
      - 'dokladny wynik'
      - 'wynik dokladny'
      - '\bcorrect score\b'
      - '\bexact score\b'
      - '^(?:\d\.\s*)?map[a-z]* \d - wynik$'
      - '\bwynik map[ya]? \d\b'
    exclude: [*half, *pistol]
    extract: [map]
    requires: [map]
    selection: round_score

  - id: correct_map_score
    market_type: correct_map_score
    patterns:
      - 'dokladny wynik'
      - 'wynik dokladny'
      - 'wynik meczu w mapach'
      - '\bcorrect (?:map )?score\b'
      - '\bexact (?:map )?score\b'
      - '\bmap score\b'
    exclude: [*half, *pistol, 'rund', '\bmap[a-z]*\s*(?:nr\.?\s*)?\d(?![\d]|[.,]\d)', '(?<![\d.,])\d\s*\.?\s*map[a-z]*\b']
    selection: map_score

  - id: round_handicap
    market_type: round_handicap
    patterns:
      - 'handicap rund'
      - 'handicap \(rundy\)'
      - 'handicap na rundy'
      - 'rundy[ :-]+handicap'
      - '\bround handicap\b'
      - '\bhandicap rounds?\b'
      - '\bhandicap\b'
    exclude: [*half, *pistol, 'handicap map\b', 'handicap mapowy', 'handicap \(mapy\)', 'handicap na mapy',
              '\bmap handicap\b', 'handicap \(maps\)', *players]
    extract: [map]
    requires: [map, line]
    selection: team_line

  - id: team_total_rounds
    market_type: team_total_rounds
    patterns:
      - 'liczba (?:wygranych )?rund'
      - 'suma rund'
      - 'laczna liczba rund'
      - 'ilosc rund'
      - 'rundy druzyny'
      - '\b(?:team )?total rounds\b'
      - '\brounds (?:won|total)\b'
      - 'liczba rund druzyny (?P<team>[12])\b'
    exclude: [*half, *pistol, *odd_even, 'handicap', *players]
    team_in_market: required
    extract: [map]
    requires: [map, team, line]
    selection: over_under

  - id: total_rounds
    market_type: total_rounds
    patterns:
      - 'liczba rund'
      - 'suma rund'
      - 'laczna liczba rund'
      - 'ilosc rund'
      - '\btotal rounds\b'
      - '\brounds total\b'
      - '\bover/under rounds\b'
    exclude: [*half, *pistol, *odd_even, 'handicap', 'druzyn', 'zespol', '\bteam\b', 'wygranych', *players]
    extract: [map]
    requires: [map, line]
    selection: over_under

  # ---------------------------------------------------------------- match-level markets
  - id: total_maps
    market_type: total_maps
    patterns:
      - 'liczba (?:rozegranych )?map\b'
      - 'suma map\b'
      - 'laczna liczba map'
      - 'ilosc map'
      - '\btotal maps\b'
      - '\bmaps total\b'
      - '\bnumber of maps\b'
    exclude: ['rund', *players]
    requires: [line]
    selection: over_under

  - id: both_teams_win_a_map
    market_type: both_teams_win_a_map
    patterns:
      - 'obie druzyny wygraja'
      - 'obie druzyny wygra\w* (?:co najmniej )?(?:jedna )?map'
      - 'kazda z druzyn wygra'
      - '\bboth teams (?:to )?win (?:a|at least one) map\b'
    selection: yes_no

  - id: map_handicap
    market_type: map_handicap
    patterns:
      - 'handicap map\b'
      - 'handicap mapowy'
      - 'handicap \(mapy\)'
      - 'handicap na mapy'
      - '\bmap handicap\b'
      - 'handicap \(maps\)'
    # A bare "Handicap" is deliberately NOT here: in a BO1 (or inside a map tab) it is a ROUND
    # handicap, and a round line read as a map handicap looks like a certain winner to the model.
    exclude: [*half, *pistol, 'rund', *players]
    requires: [line]
    selection: team_line

  - id: map_winner
    market_type: map_winner
    patterns:
      - '\b(?:zwyciezca|zwyciezcy|kto wygra|wygrana|winner|wynik)\b'
      - '^(?:\d\s*\.\s*)?map[a-z]*\s*(?:nr\.?\s*)?\d$'
      - '^\d\s*\.\s*map[a-z]*$'
    exclude: ['rund', *half, 'handicap', 'dokladny', 'liczba', 'suma', 'dogrywk', *pistol, *players,
              'pierwsz\w* do', *odd_even, 'obie', 'turniej', 'tournament', 'meczu']
    extract: [map]
    requires: [map]
    selection: team

  - id: match_winner
    market_type: match_winner
    # Bare "Zwycięzca" / "Wynik" / "Kto wygra?" are deliberately NOT here: inside a "Mapy" group they
    # may mean a map. Add them only after checking the raw payloads on the owner's PC.
    patterns:
      - '^zwyciezca (?:meczu|spotkania)$'
      - '^zwyciezca meczu \(.*\)$'
      - '^wynik (?:meczu|spotkania)$'
      - '^kto wygra (?:mecz|spotkanie)\??$'
      - '^match winner$'
      - '^match result$'
      - '^moneyline$'
      - '^1x2$'
    exclude: ['\bmap[a-z]*\s*(?:nr\.?\s*)?\d', 'turniej']
    selection: team_draw

  # ---------------------------------------------------------------- player markets
  - id: player_kills_h2h
    market_type: player_kills_h2h
    patterns:
      - '(?:zabojstw|kills?|frag).*\b(?:vs\.?|czy|kontra)\b'
      - '\b(?:vs\.?|czy|kontra)\b.*(?:zabojstw|kills?|frag)'
      - 'pojedynek'
      - '\bh2h\b'
      - '\bhead to head\b'
      - '(?<![a-z])wiecej zabojstw'
      - '\bmore kills\b'
    exclude: [*half, 'najwiecej', '\bmost kills\b', 'druzyn', 'handicap']  # kill handicaps: not parsed yet
    extract: [map, maps, players]
    segment_stopwords: ['zabojstw', '\bkills?\b', '\bfrag', 'pojedynek', '\bh2h\b', 'head to head', 'gracz',
                        'player', 'wiecej', 'more', '^kto\b', 'zdobedzie']
    requires: [players, scope]
    selection: player_draw

  - id: top_fragger
    market_type: top_fragger
    patterns:
      - 'najwiecej zabojstw'
      - 'najwieksza liczba zabojstw'
      - 'najwiecej fragow'
      - '\btop fragger\b'
      - '\bmost kills\b'
    exclude: [*half]
    team_in_market: optional
    extract: [map, maps]
    selection: player

  - id: player_kills
    market_type: player_kills
    patterns:
      - 'zabojstw'
      - '\bkills?\b'
      - '\bfrag(?:i|ow|s)?\b'
    exclude: [*half, 'druzyn', 'zespol', '\bteam\b', 'pierwsz\w* zabojstw', 'pierwsza krew', '\bfirst (?:kill|blood)\b',
              'headshot', 'asyst', 'zgon', 'smierc', 'death', 'w rundzie']
    extract: [map, maps, player]
    segment_stopwords: ['zabojstw', '\bkills?\b', '\bfrag', '^liczba$', 'gracza', '^gracz$', '\bplayer\b', '\btotal\b',
                        '^powyzej', '^ponizej', '^over\b', '^under\b']
    requires: [player, line, scope]
    selection: player_over_under

# --------------------------------------------------------------------------------------------
# Optional tuning knobs for the odds SOURCES (cs2bot.odds.source_config.BetclicSourceConfig).
# They live here until they get proper fields in cs2bot.config.BetclicSettings.
# Every key is optional; see the dataclass for defaults and meaning.
# --------------------------------------------------------------------------------------------
source:
  max_events_per_run: 40      # soonest first; events beyond settings.scope.max_hours_ahead are skipped
  min_page_delay_s: 2.5       # polite random pause between page visits
  max_page_delay_s: 6.0
  # A CS2 listing page may also list other e-sports: event links / events are kept when this regex
  # matches their URL, competition or sport name (applied to folded text).
  cs2_pattern: 'counter[\s\-_]*strike|\bcs\s*-?\s*2\b|\bcs:?\s*go\b|\bcsgo\b|\bcs2\b'
  # event pages end in "-m<id>" (e.g. /e-sport-s102/iem-chengdu-c9001/navi-faze-m1001234567)
  event_link_pattern: '-m(\d+)(?=$|[/?#])'
  fetch_categories: true          # ask the page for every market category (gRPC-web, like the site)
  click_category_tabs: true       # fallback when category fetches fail
  category_tab_selectors: ["[role='tab']", "[data-qa*='category'] button", "[class*='categor'] button"]
  consent_selectors: ["#didomi-notice-agree-button", "#onetrust-accept-btn-handler",
                      "button:has-text('Akceptuj')", "button:has-text('Zaakceptuj')", "button:has-text('Zgadzam')"]
  # user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) ..."   # default: Playwright's own
  raw_retention_days: 14

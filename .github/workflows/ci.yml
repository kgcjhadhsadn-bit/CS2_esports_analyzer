# Continuous integration: lint + types, tests on Linux (with PostgreSQL and Chromium) and Windows,
# the dashboard build, and the cloud Docker image (build, self-test, compose smoke test; no push).
# Local equivalent of the Python part: scripts/test.sh (--pg for the PostgreSQL tests).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch / pull request; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"          # use uv.lock exactly as committed
  PYTHONUTF8: "1"
  FORCE_COLOR: "1"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & types (ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no floating major tags
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check src tests
      - name: ruff format --check
        run: uv run ruff format --check src tests
      - name: mypy
        run: uv run mypy

  test-linux:
    name: Tests (Linux, PostgreSQL, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.16-bookworm  # same image as docker-compose.yml
        env:
          POSTGRES_USER: cs2bot
          POSTGRES_PASSWORD: cs2bot
          POSTGRES_DB: cs2bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cs2bot -d cs2bot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CS2BOT_TEST_DATABASE_URL: postgresql+psycopg://cs2bot:cs2bot@localhost:5432/cs2bot_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Chromium for the browser tests
        run: uv run playwright install --with-deps chromium
      - name: Expose Chromium at the path the browser tests use
        # The browser tests launch /opt/pw-browsers/chromium (the developer machines' location);
        # the executor tests also read PLAYWRIGHT_CHROMIUM_EXECUTABLE.
        run: |
          exe="$(uv run python -c 'from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)')"
          test -x "$exe"
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$exe" /opt/pw-browsers/chromium
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$exe" >> "$GITHUB_ENV"
      - name: Tests (everything except PostgreSQL)
        run: uv run pytest -q -n auto -m "not postgres"
      - name: Tests (PostgreSQL)
        # The postgres fixture drops and re-creates the schema of a single database, so these
        # tests run in one process.
        run: uv run pytest -q -p no:xdist -m postgres

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Tests (no browser, no PostgreSQL)
        run: uv run pytest -q -n auto -m "not browser and not postgres"

  dashboard:
    name: Dashboard (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - name: Is there a dashboard?
        id: present
        working-directory: .
        run: |
          if [ -f dashboard/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dashboard/package.json not found - skipping the dashboard build."
          fi
      - uses: actions/setup-node@v7
        if: steps.present.outputs.present == 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: npm ci
        if: steps.present.outputs.present == 'true'
        run: npm ci --no-audit --no-fund
      - name: npm run lint
        if: steps.present.outputs.present == 'true'
        run: npm run lint --if-present
      - name: npm test
        if: steps.present.outputs.present == 'true'
        run: npm run test --if-present
      - name: npm run build
        if: steps.present.outputs.present == 'true'
        run: npm run build

  docker:
    # The VPS deployment (docs/VPS_SETUP.md): build the image exactly as deploy.sh does (no push), run
    # its self-test (Chromium headful on Xvfb + headless, dashboard, demo tools), then bring up the
    # whole stack with deploy.sh and exercise HTTPS through Caddy, the dashboard login, backup and
    # restore. The bot runs with scheduler, executor and Claude switched off: no external services.
    name: Docker image (build, self-test, compose smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_FILE: docker-compose.cloud.yml
    steps:
      - uses: actions/checkout@v7
      - name: Shell scripts (bash -n, shellcheck)
        run: |
          for f in deploy/linux/*.sh; do bash -n "$f"; done
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version
          shellcheck -x -S warning deploy/linux/*.sh
      - name: Test .env
        run: |
          {
            echo "COMPOSE_FILE=docker-compose.cloud.yml"
            echo "APP_UID=$(id -u)"
            echo "APP_GID=$(id -g)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "CS2BOT_API__PASSWORD=$(openssl rand -hex 16)"
            echo "CS2BOT_API__SESSION_SECRET=$(openssl rand -hex 32)"
            echo "CS2BOT_PUBLIC_HOST=localhost"
            echo "CS2BOT_TLS_MODE=internal"
            echo "CS2BOT_EXECUTOR__DRY_RUN=true"
            echo "CS2BOT_EXECUTOR__ENABLED=false"
            echo "CS2BOT_SCHEDULER__ENABLED=false"
            echo "CS2BOT_LLM__ENABLED=false"
          } > .env
          chmod 600 .env
          mkdir -p data logs backups
      - name: Compose file
        run: docker compose config --quiet
      - name: Caddyfile
        run: |
          for site in "localhost internal" "bot.example.pl auto"; do
            set -- $site
            docker run --rm -e CS2BOT_PUBLIC_HOST="$1" -e CS2BOT_TLS_MODE="$2" \
              -v "$PWD/deploy/linux/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
      - name: Build the image
        run: docker compose build --pull app
      - name: Image self-test
        run: docker compose run --rm --no-deps app selftest
      - name: Compose smoke test
        run: |
          bash deploy/linux/deploy.sh --no-build --timeout 600
          curl -fsS -k --retry 10 --retry-delay 3 --retry-all-errors https://localhost/api/ping
          curl -fsS -k https://localhost/ | grep -q '<div id="root"'
          # Through Caddy: Host allow-list, https origin (CSRF) and the session cookie.
          pw="$(grep '^CS2BOT_API__PASSWORD=' .env | cut -d= -f2)"
          curl -fsS -k -c cookies.txt -H 'Content-Type: application/json' -H 'X-Requested-With: cs2bot' \
            -H 'Origin: https://localhost' -d "{\"username\":\"admin\",\"password\":\"$pw\"}" \
            https://localhost/api/auth/login
          curl -fsS -k -b cookies.txt -o /dev/null https://localhost/api/health
          test "$(curl -s -k -o /dev/null -w '%{http_code}' https://localhost/api/health)" = 401
          bash deploy/linux/backup.sh --label ci
          bash deploy/linux/restore.sh --yes
          bash deploy/linux/status.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=300 || true
      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans || true

[project]
name = "cs2bot"
version = "0.1.0"
description = "CS2 Tier 1/2 pre-match analyzer and Betclic.pl betting automation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "tenacity>=9.0",
  "selectolax>=0.3.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "playwright>=1.49",
  "rapidfuzz>=3.10",
  "numpy>=2.1",
  "scipy>=1.14",
  "pandas>=2.2",
  "polars>=1.17",
  "pyarrow>=18",
  "scikit-learn>=1.6",
  "lightgbm>=4.5",
  "joblib>=1.4",
  "demoparser2>=0.30",
  "rarfile>=4.2",
  "zstandard>=0.23",
  "anthropic>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "itsdangerous>=2.2",
  "typer>=0.15",
  "rich>=13.9",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
  "tzdata>=2024.2",
  "orjson>=3.10",
  "keyring>=25.5",
]

[project.scripts]
cs2bot = "cs2bot.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.6",
  "respx>=0.22",
  "hypothesis>=6.120",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
  "types-python-dateutil",
  "time-machine>=2.16",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs2bot"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["dashboard", "src/cs2bot/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT", "DTZ"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # Polish / typographic characters in strings are intentional
  "B008",                        # FastAPI Depends() in defaults
  "PT011",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ", "B011", "PT018", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["cs2bot"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
files = ["src/cs2bot"]
exclude = ["src/cs2bot/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"
timeout = 600
markers = [
  "postgres: needs a PostgreSQL test database (set CS2BOT_TEST_DATABASE_URL)",
  "browser: needs Playwright + Chromium",
  "network: talks to the real internet (skipped unless CS2BOT_RUN_NETWORK_TESTS=1)",
  "slow: long-running test",
]
filterwarnings = [
  "ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal objects natively:sqlalchemy.exc.SAWarning",
]

[tool.coverage.run]
source = ["src/cs2bot"]
omit = ["src/cs2bot/db/migrations/*"]

# Installed by deploy/linux/provision.sh as /etc/logrotate.d/cs2bot (@DIR@ / @USER@ are replaced).
# logs/cs2bot.log is a copy of the bot's output (the entrypoint appends with tee -a, so copytruncate
# is safe); logs/backup.log is written by backup.sh. Docker keeps its own rotated copy as well
# (docker compose logs).
@DIR@/logs/*.log {
    daily
    rotate 14
    maxsize 100M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su @USER@ @USER@
}
